[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wd14-tagger-standalone"
version = "0.0.1"
dependencies = [
    "pandas==2.2.2",
    "huggingface-hub>=0.22.2", # Original was `==0.22.0`
    "Pillow==10.0.1",
    "deepdanbooru==1.0.2",
    "onnxruntime==1.17.3",
    "numpy==1.26.4",
    "opencv-python==4.9.0.80",
]